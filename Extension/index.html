<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard — On-device Demo</title>
    <style>
        body { font-family: system-ui, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; background: #fafafa; }
        h1 { font-size: 22px; margin-bottom: 2px; }
        .sub { color: #666; font-size: 13px; margin-top: 0; }
        #status { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; margin: 8px 0 18px; background: #e6f4ea; color: #137333; }
        .card { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
        .label { font-size: 12px; color: #888; margin-bottom: 6px; }
        .msg { font-size: 15px; line-height: 1.5; display: inline-block; padding-bottom: 4px; }
        .verdict { margin-top: 10px; font-size: 12.5px; color: #444; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; margin-right: 6px; }
        .badge.high { background: #fce8e6; color: #c5221f; }
        .badge.medium { background: #fef7e0; color: #b06000; }
        .badge.low { background: #e6f4ea; color: #137333; }
        .reasons { color: #666; margin: 4px 0 0; padding-left: 18px; }
        .reasons li { margin: 1px 0; }
    </style>
</head>
<body>
    <h1>🛡️ PhishGuard — On-device Demo</h1>
    <p class="sub">Detection runs entirely in this page — same scripts the
        extension uses, <b>no backend, no internet</b>. Red = phishing, green = safe.</p>
    <span id="status">loading on-device model…</span>
    <div id="messages"></div>

    <!-- The on-device detector: same files, same order as the extension. -->
    <script src="model-data.js"></script>
    <script src="tier1.js"></script>
    <script src="heuristics.js"></script>
    <script src="detector.js"></script>
    <script>
        const CASES = [
            ["Legit SBI credit alert (Hindi+Eng) — safe", "भारतीय स्टेट बैंक की ओर से शुभकामनाएं ! Greetings from SBI ! Your A/C XXXXX373917 has credit of Rs 2.00 on 29/06/26. Avl Bal Rs 3,894.80. Please do not reply. -SBI"],
            ["Normal chat — safe", "Hey, are we still meeting for lunch at 1pm tomorrow?"],
            ["Romanized Hindi OTP scam — phishing", "URGENT! Aapka SBI khata band ho jayega. Turant KYC update karo aur OTP batao: https://sbi-verify.xyz/login"],
            ["Devanagari KYC scam — phishing", "प्रिय ग्राहक, आपका SBI खाता बंद हो जाएगा। तुरंत KYC update करें और OTP बताएं: http://sbi-verify.xyz/login"],
            ["Tamil lottery bait — phishing", "வாழ்த்துக்கள்! நீங்கள் ஒரு பரிசு வென்றுள்ளீர்கள். claim now: http://prize.top/redeem"],
            ["HDFC impersonation — phishing", "Dear customer, your HDFC account is suspended. Verify your account immediately with your CVV and PIN."],
            ["Doctor appointment — safe", "Hi, your appointment with Dr. Mehta is confirmed for Monday 11 AM at Apollo Clinic."]
        ];

        function paint(node, risk) {
            if (risk === "high") { node.style.borderBottom = "4px solid red"; node.style.backgroundColor = "rgba(255,0,0,0.15)"; }
            else if (risk === "medium") { node.style.borderBottom = "3px solid orange"; }
            else { node.style.borderBottom = "2px solid green"; }
        }

        (function run() {
            const status = document.getElementById("status");
            if (typeof PHISHGUARD_MODEL === "undefined" || typeof PhishGuardDetector === "undefined") {
                status.textContent = "❌ scripts failed to load — open this file from the Extension/ folder";
                status.style.background = "#fce8e6"; status.style.color = "#c5221f";
                return;
            }
            const det = PhishGuardDetector.make(PHISHGUARD_MODEL);
            status.textContent = "✅ on-device model loaded — " + Object.keys(PHISHGUARD_MODEL.terms).length + " features, no backend";
            const box = document.getElementById("messages");
            for (const [label, text] of CASES) {
                const card = document.createElement("div"); card.className = "card";
                const lab = document.createElement("div"); lab.className = "label"; lab.textContent = label;
                const msg = document.createElement("div"); msg.className = "msg"; msg.textContent = text;
                const v = document.createElement("div"); v.className = "verdict";
                card.append(lab, msg, v); box.appendChild(card);

                const data = det.detect(text, "");
                paint(msg, data.risk);
                const reasons = (data.reasons || []).length
                    ? `<ul class="reasons">${data.reasons.map(r => `<li>${r}</li>`).join("")}</ul>` : "";
                v.innerHTML = `<span class="badge ${data.risk}">${data.risk.toUpperCase()}</span>score ${data.score}, ML ${Math.round((data.ml_prob||0)*100)}%${reasons}`;
            }
        })();
    </script>
</body>
</html>
